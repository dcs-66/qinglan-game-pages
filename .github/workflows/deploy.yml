name: Deploy Qinglan Game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest game bundle
        run: |
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 5 --max-time 1800 \
            "https://roommates-processors-light-bernard.trycloudflare.com/_deploy.zip" \
            -o game.zip
          unzip -q game.zip -d site
          test -f site/index.html
          grep -q "20261125proc2" site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
