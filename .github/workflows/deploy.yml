name: Deploy Qinglan Game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest static site
        run: |
          set -euo pipefail
          mkdir -p site
          awk '{sub(/\r$/,""); if ($0 != "") {sub(/^\//,""); print "https://qinglan-game.pages.dev/" $0}}' urls.txt > urls.full
          cat urls.full | xargs -n1 -P 8 -I{} bash -c 'url="$1"; p="${url#https://qinglan-game.pages.dev/}"; mkdir -p "site/$(dirname "$p")"; curl -fsSL --retry 8 --retry-all-errors --retry-delay 3 --max-time 300 "$url" -o "site/$p"' _ {}
          touch site/.nojekyll
          test -f site/index.html
          test -f site/js/data/game-data.js
          grep -q "mist_beast" site/js/data/game-data.js
          grep -q "abyss_guardian" site/js/data/game-data.js

      - name: Retire Blacklace hero
        run: python3 .github/scripts/retire_blacklace.py site

      - name: Apply Boss model restore
        run: |
          set -euo pipefail
          # 使用首次成功部署时固定下来的补丁脚本（不可变提交，避免仓库内脚本被误改）
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/dcs-66/qinglan-game-pages/5a0f4f5eb01c945cc5f1cbcf7f3462c222158cec/.github/scripts/apply_boss_restore.py.gz.b64" \
            | base64 -d | gzip -d > /tmp/apply_boss_restore.py
          python3 /tmp/apply_boss_restore.py site

          # 修复宠物高频攻击把 Boss 闪成常白：宠物不触发闪白；闪白与攻击预警都记录真正底色
          python3 .github/scripts/patch_flash_base.py site
          grep -q "if (!fromPet) flashEnemyMesh(this.mesh);" site/js/combat/enemy.js
          grep -q "_baseEmissive" site/js/combat/enemy.js
          grep -q "__flashState" site/js/combat/enemy.js

          # 慢网下给机械恐龙的附加动作包更长的挂载窗口：主模型可能 30s 后才就绪，
          # 原来 12s 的定时器会提前放弃 dino_extra，导致 Hit/Death 动作缺失。
          sed -i 's/else if (tries > 240)/else if (tries > 1200)/' site/js/ui/asset-wrap.js
          grep -q "tries > 1200" site/js/ui/asset-wrap.js


          grep -q "BUILD 20261127mechidle" site/index.html
          grep -q "BUILD 20261127mechidle · 机甲站姿" site/index.html
          grep -q "id: '20261127mechidle'" site/index.html
          grep -q "aka.doubaocdn.com/s/JbhShktA3r" site/js/data/game-data.js
          grep -q "model: 'assets/models/boss_guardian.glb'" site/js/data/game-data.js
          grep -q "animMap: { Attack_a: 'Cast'" site/js/data/game-data.js
          grep -q "id === 'demon_king'" site/js/combat/enemy.js

      - name: Bundle Draco decoder for GLB hero models
        run: |
          set -euo pipefail
          dst="site/model_viewer/addons/libs/draco/gltf"
          mkdir -p "$dst"
          base="https://threejs.org/examples/jsm/libs/draco/gltf"
          for f in draco_decoder.js draco_decoder.wasm draco_wasm_wrapper.js; do
            curl -fsSL --retry 8 --retry-all-errors --retry-delay 3 --max-time 120 "$base/$f" -o "$dst/$f"
          done
          test -s "$dst/draco_decoder.js"
          test -s "$dst/draco_decoder.wasm"
          test -s "$dst/draco_wasm_wrapper.js"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
