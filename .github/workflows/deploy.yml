name: Deploy Qinglan Game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Download latest game bundle
        run: |
          curl --fail --location --retry 3 --retry-delay 5 --max-time 1800 \
            "https://roommates-processors-light-bernard.trycloudflare.com/_deploy.zip" \
            -o game.zip
          unzip -q game.zip -d site
          test -f site/index.html
          grep -q "20261125proc2" site/index.html

      - name: Publish gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "qinglan-deploy-bot"
          git config user.email "qinglan-deploy-bot@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf .
          cp -R site/. .
          git add -A
          git commit -m "Deploy BUILD 20261125proc2"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages

      - name: Enable GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"source":{"branch":"gh-pages","path":"/"},"build_type":"legacy"}')
          echo "Pages API HTTP ${code}"
          cat /tmp/pages.json
          test "${code}" = "201" || test "${code}" = "409"
